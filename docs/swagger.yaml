basePath: /
definitions:
  dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: E-Commerce backend API built with Go, PostgreSQL, Redis, and Docker.
  title: E-Commerce API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns access and refresh tokens.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Invalid request body
          schema:
            type: string
        "401":
          description: Invalid email or password
          schema:
            type: string
        "500":
          description: Failed to login
          schema:
            type: string
      summary: Login user
      tags:
      - Authentication
  /api/auth/logout:
    post:
      description: Revokes the current refresh token.
      responses:
        "204":
          description: No Content
        "401":
          description: Invalid refresh token
          schema:
            type: string
        "500":
          description: Failed to logout
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Authentication
  /api/auth/refresh:
    post:
      description: Generates a new access token and refresh token using a valid refresh
        token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "401":
          description: Invalid refresh token
          schema:
            type: string
        "500":
          description: Failed to refresh token
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Refresh access token
      tags:
      - Authentication
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new customer account.
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Invalid request body
          schema:
            type: string
        "409":
          description: Email already exists
          schema:
            type: string
        "500":
          description: Failed to register user
          schema:
            type: string
      summary: Register a new user
      tags:
      - Authentication
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer " followed by your refresh token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
